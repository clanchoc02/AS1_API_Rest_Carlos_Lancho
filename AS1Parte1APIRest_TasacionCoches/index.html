<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tasador de Coches</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-xl font-bold mb-4 text-gray-800">Tasación de Vehículos</h1>

        <form id="formulario" class="space-y-3">
            <div>
                <label class="text-sm font-medium">Marca y modelo</label>
                <input type="text" id="modelo" value="Hyundai i30" required class="w-full border p-2 rounded text-sm">
            </div>

            <div>
                <label class="text-sm font-medium">Año de matriculación</label>
                <input type="number" id="anio" value="2019" min="1995" max="2026" required class="w-full border p-2 rounded text-sm">
            </div>

            <div>
                <label class="text-sm font-medium">Kilómetros</label>
                <input type="number" id="km" value="85000" min="0" max="500000" required class="w-full border p-2 rounded text-sm">
            </div>

            <div>
                <label class="text-sm font-medium">Precio nuevo (€)</label>
                <input type="number" id="precio_nuevo" value="21000" min="3001" required class="w-full border p-2 rounded text-sm">
            </div>

            <div class="pt-1 text-sm">
                <label class="flex items-center gap-2">
                    <input type="checkbox" id="unico_dueno" checked> Único dueño
                </label>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700">
                Calcular precio
            </button>
        </form>

        <div id="resultado" class="hidden mt-5 p-4 bg-blue-50 border border-blue-200 rounded">
            <p class="text-2xl font-bold text-blue-700" id="precio"></p>
            <p class="text-sm font-semibold mt-1" id="valoracion"></p>
            <p class="text-sm text-gray-700 mt-2" id="explicacion"></p>
        </div>
    </div>

    <script src="./static/app.js"></script>
</body>
</html>
